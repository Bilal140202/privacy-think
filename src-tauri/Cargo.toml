[package]
name = "privacythink"
version = "0.1.7"
description = "Privacy-first, local-only document analysis app for Windows"
authors = ["PrivacyThink Team"]
edition = "2021"

[lib]
name = "privacythink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri and plugins
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.35"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "=1.0.64"
dirs = "6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
futures-util = "0.3"
bytes = "1"

# Thread safety
parking_lot = "0.12"
once_cell = "1"

# (rand/half pins removed — they were only needed to satisfy candle-core 0.6 constraints)

# Image processing for icon loading
image = "0.25"
ico = "0.3"    # Parse ICO files with multiple resolution layers

# Document extraction
zip = "2"              # For DOCX parsing (ZIP archives)
regex = "1"              # For code-aware chunking patterns

# Candle and tokenizers removed — inference now uses llama-run subprocess (llamacpp_subprocess.rs)
# which supports all architectures (Qwen, Phi, Gemma, LLaMA) without in-process weight loading.

# Embeddings
fastembed = "4"          # Local embedding model (all-MiniLM-L6-v2)
ndarray = "0.16"         # Array operations for embeddings

# Vector database
rusqlite = { version = "0.32", features = ["bundled"] }

# PDF extraction (optional feature)
# Uncomment to enable PDF text extraction:
# lopdf = "0.34.0"

# Note: llama-cpp-2 requires LLVM/Clang to build
# Uncomment when LLVM is installed:
# llama-cpp-2 = "0.1"

[features]
default = ["pdf"]
pdf = ["lopdf"]

[dev-dependencies]
tempfile = "3"

[dependencies.lopdf]
version = "0.34.0"
optional = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
# Prevents Windows linker LNK1318 "PDB LIMIT" errors on large debug builds
split-debuginfo = "packed"
